<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>今日灵修</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <main class="container">


        <!-- =========================
             登录区域
        ========================== -->

        <section class="auth-card">

            <h2>☁️ 我的灵修</h2>

            <div id="authLoggedOut">

                <input
                    type="email"
                    id="email"
                    placeholder="邮箱"
                >

                <input
                    type="password"
                    id="password"
                    placeholder="密码"
                >

                <div class="auth-buttons">

                    <button
                        id="signUpButton"
                        class="secondary-button"
                    >
                        注册账号
                    </button>

                    <button
                        id="signInButton"
                    >
                        登录
                    </button>

                </div>

            </div>


            <div
                id="authLoggedIn"
                style="display:none;"
            >

                <p id="userEmail"></p>

                <button
                    id="signOutButton"
                    class="secondary-button"
                >
                    退出登录
                </button>

            </div>


            <p id="authMessage"></p>

        </section>



        <!-- =========================
             页面标题
        ========================== -->

        <header>

            <p
                class="date"
                id="today"
            ></p>

            <h1>今日灵修</h1>

            <p class="subtitle">
                在主里面安静、思想、回应
            </p>

        </header>



        <!-- =========================
             今日经文
        ========================== -->

        <section class="card">

            <h2>今日经文</h2>

            <input
                type="text"
                id="bibleReference"
                placeholder="例如：以弗所书 6:10–20"
            >

            <textarea
                id="bibleText"
                placeholder="写下今天的经文……"
            ></textarea>

        </section>



        <!-- =========================
             今日领受
        ========================== -->

        <section class="card">

            <h2>
                今天神让我看见什么？
            </h2>

            <textarea
                id="reflection"
                placeholder="写下你的领受……"
            ></textarea>

        </section>



        <!-- =========================
             今日回应
        ========================== -->

        <section class="card">

            <h2>
                今天我要怎样回应？
            </h2>

            <textarea
                id="response"
                placeholder="写下今天的回应……"
            ></textarea>

        </section>



        <!-- =========================
             今日祷告
        ========================== -->

        <section class="card">

            <h2>今日祷告</h2>

            <textarea
                id="prayer"
                placeholder="写下今天的祷告……"
            ></textarea>

        </section>



        <!-- =========================
             今日学习
        ========================== -->

        <section class="card">

            <h2>今天学到的</h2>

            <textarea
                id="learning"
                placeholder="记录今天学习到的内容……"
            ></textarea>

        </section>



        <!-- =========================
             标签
        ========================== -->

        <section class="card tags-card">

            <h2>🏷️ 今天的标签</h2>

            <p class="tag-description">
                用几个词记录今天灵修的主题，以后可以快速找到相关灵修。
            </p>


            <!-- 已选择标签 -->

            <div
                id="selectedTags"
                class="selected-tags"
            ></div>


            <!-- 添加标签 -->

            <div class="tag-input-row">

                <input
                    type="text"
                    id="tagInput"
                    placeholder="例如：信靠"
                    maxlength="20"
                >

                <button
                    type="button"
                    id="addTagButton"
                    class="add-tag-button"
                >
                    添加
                </button>

            </div>


            <!-- 常用标签 -->

            <p class="tag-label">
                常用标签
            </p>

            <div
                id="suggestedTags"
                class="suggested-tags"
            >

                <button
                    type="button"
                    class="suggested-tag"
                    data-tag="信靠"
                >
                    信靠
                </button>

                <button
                    type="button"
                    class="suggested-tag"
                    data-tag="祷告"
                >
                    祷告
                </button>

                <button
                    type="button"
                    class="suggested-tag"
                    data-tag="拖延"
                >
                    拖延
                </button>

                <button
                    type="button"
                    class="suggested-tag"
                    data-tag="自律"
                >
                    自律
                </button>

                <button
                    type="button"
                    class="suggested-tag"
                    data-tag="顺服"
                >
                    顺服
                </button>

                <button
                    type="button"
                    class="suggested-tag"
                    data-tag="恩典"
                >
                    恩典
                </button>

                <button
                    type="button"
                    class="suggested-tag"
                    data-tag="焦虑"
                >
                    焦虑
                </button>

                <button
                    type="button"
                    class="suggested-tag"
                    data-tag="传福音"
                >
                    传福音
                </button>

                <button
                    type="button"
                    class="suggested-tag"
                    data-tag="学习"
                >
                    学习
                </button>

            </div>

        </section>



        <!-- =========================
             日历
        ========================== -->

        <section class="calendar-card">

            <div class="calendar-header">

                <button
                    id="prevMonth"
                    class="calendar-nav"
                    type="button"
                >
                    ‹
                </button>

                <h2 id="calendarTitle">
                    2026年8月
                </h2>

                <button
                    id="nextMonth"
                    class="calendar-nav"
                    type="button"
                >
                    ›
                </button>

            </div>


            <div class="weekdays">

                <div>日</div>
                <div>一</div>
                <div>二</div>
                <div>三</div>
                <div>四</div>
                <div>五</div>
                <div>六</div>

            </div>


            <div
                id="calendarDays"
                class="calendar-days"
            ></div>


            <p class="calendar-hint">
                点击有记录的日期，可以查看当天灵修。
            </p>

        </section>



        <!-- =========================
             保存
        ========================== -->

        <button
            id="saveButton"
            class="save-button"
            type="button"
        >
            保存今天的灵修
        </button>


        <p id="message"></p>



        <!-- =========================
             搜索
        ========================== -->

        <section class="search-card">

            <h2>🔍 搜索我的灵修</h2>

            <p class="search-description">
                搜索标签、经文、领受、回应、祷告和学习内容。
            </p>


            <div class="search-input-row">

                <input
                    type="search"
                    id="searchInput"
                    placeholder="例如：信靠、拖延、祷告……"
                >

                <button
                    type="button"
                    id="clearSearchButton"
                    class="clear-search-button"
                >
                    清除
                </button>

            </div>


            <p
                id="searchStatus"
                class="search-status"
            ></p>


            <div
                id="searchTags"
                class="search-tags"
            ></div>

        </section>



        <!-- =========================
             灵修历史
        ========================== -->

        <section class="history-section">

            <h2>📖 灵修历史</h2>

            <div id="historyList"></div>

        </section>


    </main>



    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="script.js"></script>


</body>

</html>
