<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>今日灵修</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <main class="container">


        <!-- 登录区域 -->

        <section class="auth-card">

            <h2>☁️ 我的灵修</h2>

            <div id="authLoggedOut">

                <input
                    type="email"
                    id="email"
                    placeholder="邮箱"
                >

                <input
                    type="password"
                    id="password"
                    placeholder="密码"
                >

                <div class="auth-buttons">

                    <button
                        id="signUpButton"
                        class="secondary-button"
                    >
                        注册账号
                    </button>

                    <button
                        id="signInButton"
                    >
                        登录
                    </button>

                </div>

            </div>


            <div
                id="authLoggedIn"
                style="display:none;"
            >

                <p id="userEmail"></p>

                <button
                    id="signOutButton"
                    class="secondary-button"
                >
                    退出登录
                </button>

            </div>


            <p id="authMessage"></p>

        </section>



        <!-- 页面标题 -->

        <header>

            <p
                class="date"
                id="today"
            ></p>

            <h1>今日灵修</h1>

            <p class="subtitle">
                在主里面安静、思想、回应
            </p>

        </header>



        <!-- 今日经文 -->

        <section class="card">

            <h2>今日经文</h2>

            <input
                type="text"
                id="bibleReference"
                placeholder="例如：以弗所书 6:10–20"
            >

            <textarea
                id="bibleText"
                placeholder="写下今天的经文……"
            ></textarea>

        </section>



        <!-- 今日领受 -->

        <section class="card">

            <h2>
                今天神让我看见什么？
            </h2>

            <textarea
                id="reflection"
                placeholder="写下你的领受……"
            ></textarea>

        </section>



        <!-- 今日回应 -->

        <section class="card">

            <h2>
                今天我要怎样回应？
            </h2>

            <textarea
                id="response"
                placeholder="写下今天的回应……"
            ></textarea>

        </section>



        <!-- 今日祷告 -->

        <section class="card">

            <h2>今日祷告</h2>

            <textarea
                id="prayer"
                placeholder="写下今天的祷告……"
            ></textarea>

        </section>



        <!-- 今日学习 -->

        <section class="card">

            <h2>今天学到的</h2>

            <textarea
                id="learning"
                placeholder="记录今天学习到的内容……"
            ></textarea>

        </section>



        <!-- 日历 -->

        <section class="calendar-card">

            <div class="calendar-header">

                <button
                    id="prevMonth"
                    class="calendar-nav"
                >
                    ‹
                </button>

                <h2 id="calendarTitle">
                    2026年8月
                </h2>

                <button
                    id="nextMonth"
                    class="calendar-nav"
                >
                    ›
                </button>

            </div>


            <div class="weekdays">

                <div>日</div>
                <div>一</div>
                <div>二</div>
                <div>三</div>
                <div>四</div>
                <div>五</div>
                <div>六</div>

            </div>


            <div
                id="calendarDays"
                class="calendar-days"
            ></div>


            <p class="calendar-hint">
                点击有记录的日期，可以查看当天灵修。
            </p>

        </section>



        <!-- 保存按钮 -->

        <button
            id="saveButton"
            class="save-button"
        >
            保存今天的灵修
        </button>



        <!-- 保存提示 -->

        <p id="message"></p>



        <!-- 灵修历史 -->

        <section class="history-section">

            <h2>📖 灵修历史</h2>

            <div id="historyList"></div>

        </section>


    </main>



    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="script.js"></script>


</body>

</html>
