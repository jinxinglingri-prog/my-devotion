<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>今日灵修</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <main class="container">


        <!-- =========================
             页面标题
             ========================= -->

        <header>

            <p
                class="date"
                id="today"
            ></p>

            <h1>今日灵修</h1>

            <p class="subtitle">
                在主里面安静、思想、回应
            </p>

        </header>



        <!-- =========================
             今日经文
             ========================= -->

        <section class="card">

            <h2>今日经文</h2>

            <input
                type="text"
                id="bibleReference"
                placeholder="例如：以弗所书 6:10–20"
            >

            <textarea
                id="bibleText"
                placeholder="写下今天的经文……"
            ></textarea>

        </section>



        <!-- =========================
             今日领受
             ========================= -->

        <section class="card">

            <h2>
                今天神让我看见什么？
            </h2>

            <textarea
                id="reflection"
                placeholder="写下你的领受……"
            ></textarea>

        </section>



        <!-- =========================
             今日回应
             ========================= -->

        <section class="card">

            <h2>
                今天我要怎样回应？
            </h2>

            <textarea
                id="response"
                placeholder="写下今天的回应……"
            ></textarea>

        </section>



        <!-- =========================
             今日祷告
             ========================= -->

        <section class="card">

            <h2>
                今日祷告
            </h2>

            <textarea
                id="prayer"
                placeholder="写下今天的祷告……"
            ></textarea>

        </section>



        <!-- =========================
             今日学习
             ========================= -->

        <section class="card">

            <h2>
                今天学到的
            </h2>

            <textarea
                id="learning"
                placeholder="记录今天学习到的内容……"
            ></textarea>

        </section>



        <!-- =========================
             操作按钮
             ========================= -->

        <button
            id="saveButton"
            type="button"
        >
            保存今天的灵修
        </button>


        <button
            id="historyButton"
            type="button"
        >
            查看灵修历史
        </button>


        <button
            id="todayButton"
            type="button"
        >
            ✨ 返回今天
        </button>


        <!-- 保存 / 状态提示 -->

        <p id="message"></p>



        <!-- =========================
             灵修日历
             ========================= -->

        <section
            id="calendarSection"
            class="history-section"
        >

            <h2>
                📅 灵修日历
            </h2>


            <!-- 月份切换 -->

            <div class="calendar-header">

                <button
                    id="prevMonth"
                    class="calendar-nav"
                    type="button"
                >
                    ‹
                </button>


                <div id="calendarTitle"></div>


                <button
                    id="nextMonth"
                    class="calendar-nav"
                    type="button"
                >
                    ›
                </button>

            </div>



            <!-- 星期 -->

            <div class="calendar-weekdays">

                <div>一</div>

                <div>二</div>

                <div>三</div>

                <div>四</div>

                <div>五</div>

                <div>六</div>

                <div>日</div>

            </div>



            <!-- 日期 -->

            <div
                id="calendar"
                class="calendar"
            ></div>


            <p class="calendar-tip">
                ● 有灵修记录　　点击日期查看
            </p>

        </section>



        <!-- =========================
             灵修历史
             ========================= -->

        <section
            id="historySection"
            class="history-section"
        >

            <h2>
                📖 灵修历史
            </h2>


            <div id="historyList"></div>

        </section>


    </main>



    <!-- =========================
         JavaScript
         ========================= -->

    <script src="script.js"></script>


</body>

</html>
