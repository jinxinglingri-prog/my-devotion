<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>今日灵修</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="container">

        <header>

            <p
                class="date"
                id="today"
            ></p>

            <h1>今日灵修</h1>

            <p class="subtitle">
                在主里面安静、思想、回应
            </p>

        </header>


        <section class="card">

            <h2>今日经文</h2>

            <input
                type="text"
                id="bibleReference"
                placeholder="例如：以弗所书 6:10–20"
            >

            <textarea
                id="bibleText"
                placeholder="写下今天的经文……"
            ></textarea>

        </section>


        <section class="card">

            <h2>今天神让我看见什么？</h2>

            <textarea
                id="reflection"
                placeholder="写下你的领受……"
            ></textarea>

        </section>


        <section class="card">

            <h2>今天我要怎样回应？</h2>

            <textarea
                id="response"
                placeholder="写下今天的回应……"
            ></textarea>

        </section>


        <section class="card">

            <h2>今日祷告</h2>

            <textarea
                id="prayer"
                placeholder="写下今天的祷告……"
            ></textarea>

        </section>


        <section class="card">

            <h2>今天学到的</h2>

            <textarea
                id="learning"
                placeholder="记录今天学习到的内容……"
            ></textarea>

        </section>


        <button id="saveButton">
            保存今天的灵修
        </button>


        <button id="historyButton">
            查看灵修历史
        </button>


        <p id="message"></p>


        <section
            id="historySection"
            class="history-section"
        >

            <h2>📖 灵修历史</h2>

            <div id="historyList"></div>

        </section>


    </main>


    <script src="script.js"></script>

</body>

</html>
